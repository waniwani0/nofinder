<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141210">
<meta name="description" content="覗き穴しか映らないフィルムカメラ。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ノーファインダー">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    box-sizing:border-box;color-scheme:dark;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<title>ノーファインダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  :root{
    --ground:#0B0B0B;      /* the dark around the camera */
    --door:#272727;        /* sampled from the back door */
    --plate:#E0DEDA;       /* sampled from the top plate */
    --ink:#E2DED6;         /* type on the door */
    --ink-dim:#8C857C;
    --ink-dark:#3A3733;    /* type on the white plate */
    --rule:rgba(226,222,214,.2);
    --brass:#A9884A;
    --film:#96402E;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  }
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }
  [hidden]{display:none!important}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

  /* ============ the camera ============
     One photograph of the body, scaled to fit. Everything else is positioned
     as a percentage of it, so the parts stay on their painted places. */
  .wrap{
    height:100%;display:flex;align-items:center;justify-content:center;
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
    box-sizing:border-box;
  }
  .stage{
    position:relative;height:100%;max-width:100%;aspect-ratio:600/315;
    container-type:size;
    transition:filter 1.1s ease;
  }
  body.dim .stage{filter:brightness(.34)}

  .body-img{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    z-index:2;pointer-events:none;user-select:none;
  }

  /* the finder is a hole punched through the photograph — the feed sits under it */
  .feed{
    position:absolute;z-index:1;
    left:31.333%;top:8.254%;width:5.833%;height:10.476%;
    object-fit:cover;display:block;background:#000;
  }
  .feed.mirror{transform:scaleX(-1)}

  /* printed marking under the finder, on the white plate */
  .demo-badge{
    position:absolute;z-index:3;left:4.5%;top:9.5%;
    font-family:var(--mono);font-size:1.15cqw;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-dark);
  }

  /* ============ shutter release, on the bare right of the plate ============ */
  .shutter{
    position:absolute;z-index:3;
    left:73.33%;top:4.76%;width:9.33%;height:17.78%;
    border-radius:999px;
    transition:transform .08s ease,filter .08s ease;
  }
  .shutter img{width:100%;height:100%;display:block}
  .shutter:active{transform:translateY(1.2%) scale(.965);filter:brightness(.93)}
  .shutter[disabled]{filter:grayscale(1) brightness(.8) opacity(.5);cursor:default}
  .shutter-label{
    position:absolute;z-index:3;left:73.33%;width:9.33%;top:23.4%;
    text-align:center;font-family:var(--mono);font-size:1.15cqw;
    letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dark);
  }

  /* ============ the back door ============ */
  .door{
    position:absolute;z-index:3;left:0;right:0;top:27.3%;bottom:0;
    padding:4.2% 5.5% 5%;box-sizing:border-box;
    display:flex;flex-direction:column;gap:2.4cqw;
  }
  .door-top{display:flex;align-items:flex-end;gap:4cqw}
  .count{display:flex;align-items:baseline;gap:1.4cqw}
  .count b{
    font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;
    font-size:7cqw;line-height:.85;color:var(--ink);
    transition:transform .12s ease;display:block;
  }
  .count b.tick{transform:translateY(-.4cqw)}
  .eng{
    font-family:var(--mono);font-size:1.2cqw;letter-spacing:.24em;
    text-transform:uppercase;color:var(--ink-dim);
  }
  .lamp{display:flex;align-items:center;gap:1cqw;font-family:var(--mono);
    font-size:1.2cqw;letter-spacing:.22em;color:var(--ink-dim);padding-bottom:.4cqw}
  .lamp i{width:.9cqw;height:.9cqw;border-radius:999px;background:var(--film);
    display:block;animation:beat 2.6s infinite}
  .lamp.off i{background:#3C3C3C;animation:none}
  .lamp.test i{background:var(--brass)}
  @keyframes beat{0%,62%,100%{opacity:.34}72%{opacity:1}}

  .note{margin:0;font-size:1.75cqw;line-height:1.8;color:var(--ink-dim);max-width:46cqw}
  .note em{font-style:normal;color:var(--ink)}
  .notice{display:flex;align-items:center;gap:2.4cqw;flex-wrap:wrap}
  .notice p{margin:0;font-size:1.75cqw;line-height:1.8;color:var(--ink-dim);max-width:46cqw}
  .notice p b{color:var(--brass);font-weight:500}

  .controls{margin-top:auto;display:flex;align-items:center;gap:1.4cqw;flex-wrap:wrap}
  .ctl,.btn-line{
    border:1px solid var(--rule);border-radius:1px;color:var(--ink);
    padding:1.1cqw 1.8cqw;font-size:1.6cqw;letter-spacing:.06em;
    display:inline-flex;align-items:center;gap:.9cqw;
    transition:border-color .15s ease,color .15s ease;
  }
  .ctl b{font-family:var(--mono);font-weight:500;color:var(--ink-dim)}
  .ctl:active{border-color:var(--ink);}
  .ctl[aria-pressed="false"]{color:var(--ink-dim)}
  .ctl[aria-pressed="false"] b{text-decoration:line-through}

  /* ============ rotate gate ============ */
  .rotate{
    position:fixed;inset:0;z-index:50;background:var(--ground);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    padding:24px;text-align:center;box-sizing:border-box;
  }
  .rotate svg{color:var(--brass);animation:tilt 2.8s ease-in-out infinite}
  @keyframes tilt{0%,45%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}
  .rotate p{margin:0;font-size:15px;line-height:1.9;letter-spacing:.06em}
  .rotate p b{color:var(--brass)}
  .rotate small{font-family:var(--mono);font-size:10px;letter-spacing:.24em;
    color:var(--ink-dim);text-transform:uppercase}

  /* ============ sheets ============ */
  .sheet{
    position:fixed;inset:0;z-index:40;background:var(--ground);
    display:flex;flex-direction:column;box-sizing:border-box;
    padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));
  }
  .sheet-bar{
    flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    padding-block:14px 10px;border-bottom:1px solid var(--rule);
  }
  .sheet-bar h2{margin:0;font-size:14px;font-weight:500;letter-spacing:.08em}
  .sheet-bar .sub{font-family:var(--mono);font-size:10px;color:var(--ink-dim);
    letter-spacing:.18em;text-transform:uppercase}
  .sheet-body{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:14px 26px}
  .close{font-size:11.5px;letter-spacing:.12em;color:var(--ink-dim);
    border:1px solid var(--rule);border-radius:1px;padding:7px 13px}

  .roll-label{
    display:flex;align-items:center;gap:10px;margin:20px 0 9px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--ink-dim);
  }
  .roll-label:first-child{margin-top:0}
  .roll-label hr{flex:1;border:0;border-top:1px solid var(--rule);margin:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px}
  .grid button{aspect-ratio:1;overflow:hidden;background:#000;border:1px solid var(--rule)}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  .empty{color:var(--ink-dim);font-size:12.5px;line-height:2;text-align:center;padding:40px 0}

  .viewer-img{width:100%;max-width:min(100%,720px);border:1px solid var(--rule);display:block;margin:0 auto}
  .viewer-meta{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin:12px auto 0;max-width:min(100%,720px);
    font-family:var(--mono);font-size:10.5px;color:var(--ink-dim);letter-spacing:.08em;
  }
  .viewer-hint{margin:14px auto 0;max-width:min(100%,720px);font-size:11.5px;
    color:var(--ink-dim);line-height:1.85}
  .trash{color:var(--film);font-size:11px;letter-spacing:.1em;
    border:1px solid rgba(150,64,46,.5);border-radius:1px;padding:7px 13px}
  .btn-line{border-color:var(--brass);color:var(--brass)}

  #toast{
    position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%);z-index:60;
    background:var(--door);border:1px solid var(--rule);border-radius:1px;
    padding:8px 15px;font-size:11.5px;letter-spacing:.06em;color:var(--ink);
    opacity:0;transition:opacity .25s ease;pointer-events:none;white-space:nowrap;
  }
  #toast.on{opacity:1}

  @media (prefers-reduced-motion:reduce){
    *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">

    <video id="cam" class="feed" playsinline muted autoplay></video>
    <canvas id="demo" class="feed" hidden></canvas>

    <img class="body-img" src="img/body.png" alt="カメラの背面" draggable="false">

    <span class="demo-badge" id="demoBadge" hidden>test signal</span>

    <button type="button" class="shutter" id="shutter" aria-label="シャッター">
      <img src="img/shutter.png" alt="" draggable="false">
    </button>
    <span class="shutter-label">release</span>

    <div class="door">
      <div class="door-top">
        <div class="count">
          <b id="counter">00</b>
          <span class="eng">exposures</span>
        </div>
        <div class="lamp" id="lamp"><i></i><span id="lampText">起動中</span></div>
      </div>

      <p class="note" id="note">見えるのは<em>覗き穴の分だけ</em>。構図は勘で決めて、押したら次へ。</p>

      <div class="notice" id="notice" hidden>
        <p id="noticeMsg"></p>
        <button type="button" class="btn-line ctl" id="retry">カメラを再試行</button>
      </div>

      <div class="controls">
        <button type="button" class="ctl" id="lookBtn">フィルム <b id="lookLabel">カラーネガ</b></button>
        <button type="button" class="ctl" id="snd" aria-pressed="true">シャッター音 <b>on</b></button>
      </div>
    </div>

  </div>
</div>

<div class="rotate" id="rotate" hidden>
  <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18.5h2"/></svg>
  <p>カメラを<b>横</b>に構えてください</p>
  <small>hold it sideways</small>
</div>

<div class="sheet" id="gallery" hidden>
  <div class="sheet-bar">
    <div>
      <h2>裏ぶたの中</h2>
      <div class="sub" id="galCount">0 frames</div>
    </div>
    <button type="button" class="close" id="galClose">ふたを閉じる</button>
  </div>
  <div class="sheet-body" id="galBody"></div>
</div>

<div class="sheet" id="viewer" hidden>
  <div class="sheet-bar">
    <div><h2>1枚</h2><div class="sub" id="vDate"></div></div>
    <button type="button" class="close" id="vClose">戻る</button>
  </div>
  <div class="sheet-body">
    <img class="viewer-img" id="vImg" alt="撮影した写真">
    <div class="viewer-meta">
      <span id="vRoll"></span>
      <button type="button" class="trash" id="vDel">この1枚を捨てる</button>
    </div>
    <p class="viewer-hint">写真アプリに残すには、画像を長押しして「”写真”に追加」を選んでください。</p>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };

  var video   = $("#cam"),
      counter = $("#counter"),
      lampEl  = $("#lamp"),
      lampTxt = $("#lampText"),
      note    = $("#note"),
      notice  = $("#notice"),
      demoCv  = $("#demo"),
      shutter = $("#shutter"),
      toastEl = $("#toast");

  var canvas = document.createElement("canvas");
  var ctx = canvas.getContext("2d");

  var state = { roll:1, count:0, look:"color" };
  var facing = "environment";   /* the one lens this body has */
  var stream = null, ready = false, busy = false, soundOn = true;
  var demo = false, demoTimer = null, noticeOn = false;
  var db = null, mem = [], memId = 0;

  /* ---------- storage ---------- */
  function openDB(){
    return new Promise(function(res){
      try{
        var req = indexedDB.open("nofinder", 1);
        req.onupgradeneeded = function(){
          var d = req.result;
          if(!d.objectStoreNames.contains("shots")){
            var s = d.createObjectStore("shots",{keyPath:"id",autoIncrement:true});
            s.createIndex("roll","roll");
          }
          if(!d.objectStoreNames.contains("meta")) d.createObjectStore("meta");
        };
        req.onsuccess = function(){ res(req.result); };
        req.onerror   = function(){ res(null); };
      }catch(e){ res(null); }
    });
  }
  function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
  function wrap(r){ return new Promise(function(res,rej){ r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }

  var Store = {
    add: function(rec){
      if(!db){ rec.id = ++memId; mem.push(rec); return Promise.resolve(rec.id); }
      return wrap(tx("shots","readwrite").add(rec));
    },
    all: function(){
      if(!db) return Promise.resolve(mem.slice());
      return wrap(tx("shots","readonly").getAll());
    },
    countRoll: function(roll){
      if(!db) return Promise.resolve(mem.filter(function(s){return s.roll===roll;}).length);
      return wrap(tx("shots","readonly").index("roll").count(roll));
    },
    del: function(id){
      if(!db){ mem = mem.filter(function(s){return s.id!==id;}); return Promise.resolve(); }
      return wrap(tx("shots","readwrite").delete(id));
    },
    saveMeta: function(){
      if(!db) return Promise.resolve();
      return wrap(tx("meta","readwrite").put({roll:state.roll,look:state.look},"state")).catch(function(){});
    },
    loadMeta: function(){
      if(!db) return Promise.resolve(null);
      return wrap(tx("meta","readonly").get("state")).catch(function(){ return null; });
    }
  };

  /* ---------- feedback ---------- */
  var ac = null;
  function clack(){
    if(!soundOn) return;
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      ac = ac || new AC();
      if(ac.state === "suspended") ac.resume();
      var t = ac.currentTime;
      var len = Math.floor(ac.sampleRate * 0.05);
      var buf = ac.createBuffer(1, len, ac.sampleRate);
      var d = buf.getChannelData(0);
      for(var i=0;i<len;i++){ d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 6); }
      var src = ac.createBufferSource(); src.buffer = buf;
      var bp = ac.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2800; bp.Q.value=1.2;
      var g = ac.createGain(); g.gain.value = 0.45;
      src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(t);
      var o = ac.createOscillator(); o.type="triangle";
      o.frequency.setValueAtTime(340,t); o.frequency.exponentialRampToValueAtTime(95,t+0.06);
      var g2 = ac.createGain();
      g2.gain.setValueAtTime(0.3,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      o.connect(g2); g2.connect(ac.destination); o.start(t); o.stop(t+0.11);
      /* film advance: a short ratchet a beat later */
      var rl = Math.floor(ac.sampleRate * 0.18);
      var rb = ac.createBuffer(1, rl, ac.sampleRate);
      var rd = rb.getChannelData(0);
      for(var j=0;j<rl;j++){
        var env = Math.pow(1 - j/rl, 2);
        var teeth = (Math.sin(j * 0.19) > 0.4) ? 1 : 0.25;
        rd[j] = (Math.random()*2-1) * env * teeth * 0.6;
      }
      var rsrc = ac.createBufferSource(); rsrc.buffer = rb;
      var hp = ac.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1400;
      var rg = ac.createGain(); rg.gain.value = 0.22;
      rsrc.connect(hp); hp.connect(rg); rg.connect(ac.destination); rsrc.start(t + 0.14);
    }catch(e){}
  }
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove("on"); }, 2200);
  }

  /* ---------- film stocks ----------
     The sensor hands over a clean video frame. These bake the look in at the
     moment of exposure, the way the emulsion would: tone curve, colour cast,
     halation around the highlights, grain, and corner falloff. */
  var LOOKS = [
    { id:"color", name:"カラーネガ",
      sat:0.86, contrast:0.34, fade:0.055,
      gamma:[0.98,1.00,1.04], gain:[1.03,1.00,0.97], lift:[0.012,0.014,0.030],
      grain:13, vignette:0.30,
      halation:{ amount:0.34, threshold:0.72, tint:[1.00,0.42,0.22] } },
    { id:"mono", name:"モノクロ",
      sat:0.00, contrast:0.46, fade:0.040,
      gamma:[1.00,1.00,1.00], gain:[1.00,1.00,1.00], lift:[0.020,0.019,0.017],
      grain:21, vignette:0.34,
      halation:{ amount:0.22, threshold:0.76, tint:[1.00,1.00,1.00] } },
    { id:"faded", name:"期限切れ",
      sat:0.62, contrast:0.16, fade:0.140,
      gamma:[0.94,1.02,1.08], gain:[1.06,0.97,1.02], lift:[0.050,0.030,0.055],
      grain:17, vignette:0.42,
      halation:{ amount:0.46, threshold:0.62, tint:[1.00,0.55,0.30] } },
    { id:"raw", name:"そのまま", raw:true }
  ];
  var LONG_EDGE = 1600;   /* a compact film camera does not resolve more */

  var NOISE = new Float32Array(8192);
  for(var ni0 = 0; ni0 < NOISE.length; ni0++){ NOISE[ni0] = Math.random() * 2 - 1; }

  function currentLook(){
    for(var i = 0; i < LOOKS.length; i++){ if(LOOKS[i].id === state.look) return LOOKS[i]; }
    return LOOKS[0];
  }

  function buildLUT(look){
    var lut = [new Uint8ClampedArray(256), new Uint8ClampedArray(256), new Uint8ClampedArray(256)];
    for(var c = 0; c < 3; c++){
      for(var i = 0; i < 256; i++){
        var v = Math.pow(i / 255, look.gamma[c]);
        var sc = v * v * (3 - 2 * v);            /* S curve, blended by contrast */
        v = v + (sc - v) * look.contrast;
        v = v * look.gain[c] + look.lift[c];
        v = look.fade + v * (1 - look.fade);     /* the black never reaches zero */
        lut[c][i] = Math.round(Math.max(0, Math.min(1, v)) * 255);
      }
    }
    return lut;
  }

  function develop(cv, g, look){
    if(!look || look.raw) return;
    var W = cv.width, H = cv.height;

    /* halation: light scattering back off the film base, around the highlights */
    var h = look.halation;
    if(h && h.amount > 0){
      var sw = Math.max(24, Math.round(W / 12)), sh = Math.max(18, Math.round(H / 12));
      var sm = document.createElement("canvas");
      sm.width = sw; sm.height = sh;
      var sg = sm.getContext("2d");
      sg.drawImage(cv, 0, 0, sw, sh);
      var d = sg.getImageData(0, 0, sw, sh), a = d.data, thr = h.threshold * 255;
      for(var i = 0; i < a.length; i += 4){
        var l = a[i] * 0.2126 + a[i+1] * 0.7152 + a[i+2] * 0.0722;
        var e = (l - thr) / (255 - thr);
        if(e <= 0){ a[i] = a[i+1] = a[i+2] = 0; }
        else{
          e = Math.min(1, e) * 255;
          a[i] = e * h.tint[0]; a[i+1] = e * h.tint[1]; a[i+2] = e * h.tint[2];
        }
        a[i+3] = 255;
      }
      sg.putImageData(d, 0, 0);
      g.save();
      g.globalCompositeOperation = "screen";
      g.globalAlpha = h.amount;
      g.imageSmoothingEnabled = true;
      if("imageSmoothingQuality" in g) g.imageSmoothingQuality = "high";
      g.drawImage(sm, 0, 0, W, H);   /* scaling back up is the blur */
      g.restore();
    }

    /* one pass for grade, grain and falloff */
    var img = g.getImageData(0, 0, W, H), p = img.data;
    var lut = buildLUT(look), lr = lut[0], lg = lut[1], lb = lut[2];
    var sat = look.sat, grain = look.grain, vig = look.vignette;
    var cx = W / 2, cy = H / 2, maxd = cx * cx + cy * cy;
    var n = (Math.random() * NOISE.length) | 0;
    var idx = 0;
    for(var y = 0; y < H; y++){
      var dy = y - cy, dy2 = dy * dy;
      for(var x = 0; x < W; x++, idx += 4){
        var r = p[idx], gr = p[idx+1], b = p[idx+2];
        var lum = r * 0.2126 + gr * 0.7152 + b * 0.0722;
        if(sat !== 1){ r = lum + (r - lum) * sat; gr = lum + (gr - lum) * sat; b = lum + (b - lum) * sat; }
        r  = lr[r  < 0 ? 0 : r  > 255 ? 255 : r  | 0];
        gr = lg[gr < 0 ? 0 : gr > 255 ? 255 : gr | 0];
        b  = lb[b  < 0 ? 0 : b  > 255 ? 255 : b  | 0];
        if(grain){
          /* grain sits heaviest in the midtones, as it does on film */
          var q = NOISE[(n++) & 8191] * grain * (1 - Math.abs(lum / 255 - 0.45) * 1.2);
          r += q; gr += q; b += q;
        }
        if(vig){
          var dx = x - cx;
          var f = 1 - vig * ((dx * dx + dy2) / maxd);
          r *= f; gr *= f; b *= f;
        }
        p[idx] = r; p[idx+1] = gr; p[idx+2] = b;
      }
    }
    g.putImageData(img, 0, 0);
  }

  /* ---------- test signal ----------
     Stands in for the sensor where no camera is available (a desktop preview,
     a denied permission) so the whole camera stays operable. Resolution
     independent: the finder draws it small, a shot renders it large. */
  var scene = document.createElement("canvas");
  var sctx = scene.getContext("2d");
  var grain = null;

  function grainTile(){
    if(grain) return grain;
    var c = document.createElement("canvas");
    c.width = c.height = 128;
    var g = c.getContext("2d");
    var img = g.createImageData(128, 128);
    for(var i = 0; i < img.data.length; i += 4){
      var v = 112 + Math.random() * 54;
      img.data[i] = img.data[i+1] = img.data[i+2] = v;
      img.data[i+3] = 40;
    }
    g.putImageData(img, 0, 0);
    grain = c;
    return grain;
  }

  function mix(a, b, t){
    return "rgb(" + Math.round(a[0]+(b[0]-a[0])*t) + "," +
                    Math.round(a[1]+(b[1]-a[1])*t) + "," +
                    Math.round(a[2]+(b[2]-a[2])*t) + ")";
  }

  /* dawn → noon → dusk → night, looping */
  var SKY_TOP = [[84,90,104],[122,138,156],[86,82,88],[26,27,33]];
  var SKY_LOW = [[176,148,122],[176,186,190],[168,130,106],[42,42,48]];

  function paintScene(cv, g, t){
    var W = cv.width, H = cv.height, day = (t / 24000) % 1;
    var seg = day * SKY_TOP.length, i = Math.floor(seg), f = seg - i;
    var j = (i + 1) % SKY_TOP.length;

    var sky = g.createLinearGradient(0, 0, 0, H * 0.72);
    sky.addColorStop(0, mix(SKY_TOP[i], SKY_TOP[j], f));
    sky.addColorStop(1, mix(SKY_LOW[i], SKY_LOW[j], f));
    g.fillStyle = sky;
    g.fillRect(0, 0, W, H);

    // sun tracking the same cycle — a disc, not a bloom
    var sx = W * (0.1 + day * 0.85), sy = H * (0.62 - Math.sin(day * Math.PI) * 0.46);
    var halo = g.createRadialGradient(sx, sy, H * 0.02, sx, sy, H * 0.16);
    halo.addColorStop(0, "rgba(232,224,204,.5)");
    halo.addColorStop(1, "rgba(232,224,204,0)");
    g.fillStyle = halo;
    g.beginPath(); g.arc(sx, sy, H * 0.16, 0, 7); g.fill();
    g.fillStyle = "rgba(238,232,214,.8)";
    g.beginPath(); g.arc(sx, sy, H * 0.026, 0, 7); g.fill();

    // clouds drifting at their own speeds
    g.fillStyle = "rgba(226,222,212,.16)";
    for(var c = 0; c < 7; c++){
      var cw = W * (0.14 + (c % 3) * 0.07);
      var cx = ((t / (52 + c * 17)) + c * W * 0.31) % (W + cw * 2) - cw;
      var cy = H * (0.08 + (c % 4) * 0.075);
      g.beginPath();
      g.ellipse(cx, cy, cw, cw * 0.2, 0, 0, 7);
      g.fill();
    }

    // three ridges, each with its own drift
    var ridges = [
      {y:0.70, amp:0.045, col:"rgba(58,60,58,.5)",  sp:0.00022, fr:2.1},
      {y:0.78, amp:0.055, col:"rgba(38,40,39,.75)", sp:0.00041, fr:1.4},
      {y:0.88, amp:0.038, col:"#151412",            sp:0.00072, fr:3.0}
    ];
    ridges.forEach(function(r){
      g.fillStyle = r.col;
      g.beginPath();
      g.moveTo(0, H);
      for(var x = 0; x <= W; x += 8){
        var u = x / W;
        var y = H * (r.y + Math.sin(u * r.fr * 6.283 + t * r.sp) * r.amp
                           + Math.sin(u * r.fr * 14.7 + t * r.sp * 1.7) * r.amp * 0.3);
        g.lineTo(x, y);
      }
      g.lineTo(W, H);
      g.closePath();
      g.fill();
    });

    // a few birds, because a still frame should still have a subject
    g.strokeStyle = "rgba(24,22,20,.5)";
    g.lineWidth = Math.max(1, W / 420);
    for(var b = 0; b < 3; b++){
      var bx = ((t / (30 + b * 9)) + b * W * 0.4) % (W + 80) - 40;
      var by = H * (0.2 + b * 0.05) + Math.sin(t / 700 + b) * H * 0.014;
      var w = W * 0.016;
      g.beginPath();
      g.moveTo(bx - w, by);
      g.quadraticCurveTo(bx - w / 2, by - w * 0.6, bx, by);
      g.quadraticCurveTo(bx + w / 2, by - w * 0.6, bx + w, by);
      g.stroke();
    }

    // film grain and a vignette
    var pat = g.createPattern(grainTile(), "repeat");
    if(pat){ g.fillStyle = pat; g.fillRect(0, 0, W, H); }
    var vig = g.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.78);
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(1, "rgba(0,0,0,.34)");
    g.fillStyle = vig;
    g.fillRect(0, 0, W, H);
  }

  function drawFinder(){
    var box = demoCv.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var px = Math.max(48, Math.round(box.width * dpr));
    if(demoCv.width !== px){ demoCv.width = demoCv.height = px; }
    var side = Math.min(scene.width, scene.height);
    demoCv.getContext("2d").drawImage(
      scene, (scene.width - side) / 2, (scene.height - side) / 2, side, side,
      0, 0, px, px);
  }

  function demoFrame(){
    if(!demo) return;
    if(scene.width !== 768){ scene.width = 768; scene.height = 576; }
    paintScene(scene, sctx, Date.now());
    drawFinder();
    demoTimer = setTimeout(function(){
      requestAnimationFrame(demoFrame);
    }, 1000 / 24);   /* 24fps, like the film it is pretending to be */
  }

  function startDemo(){
    demo = true;
    ready = true;
    video.hidden = true;
    demoCv.hidden = false;
    $("#demoBadge").hidden = false;
    lampEl.classList.remove("off");
    lampEl.classList.add("test");
    lampTxt.textContent = "TEST SIGNAL";
    renderCounter();
    demoFrame();
  }

  function stopDemo(){
    demo = false;
    clearTimeout(demoTimer);
    demoCv.hidden = true;
    $("#demoBadge").hidden = true;
    video.hidden = false;
    lampEl.classList.remove("test");
  }

  function showNotice(html){
    $("#noticeMsg").innerHTML = html;
    noticeOn = true;
    notice.hidden = false;
    renderCounter();
  }
  function clearNotice(){
    noticeOn = false;
    notice.hidden = true;
    renderCounter();
  }

  /* ---------- idle dimming ---------- */
  var idleT;
  function wake(){
    document.body.classList.remove("dim");
    clearTimeout(idleT);
    if(!$("#gallery").hidden || !$("#viewer").hidden) return;
    idleT = setTimeout(function(){ document.body.classList.add("dim"); }, 12000);
  }

  /* ---------- render ---------- */
  function renderLook(){
    $("#lookLabel").textContent = currentLook().name;
  }
  function renderSound(){
    var b = $("#snd");
    b.setAttribute("aria-pressed", String(soundOn));
    b.querySelector("b").textContent = soundOn ? "on" : "off";
  }

  function renderCounter(){
    counter.textContent = String(state.count).padStart(2,"0");
    note.hidden = noticeOn;
    shutter.disabled = !ready;
  }

  /* ---------- camera ---------- */
  function stopStream(){
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
  }
  function start(){
    ready = false;
    lampEl.classList.add("off");
    lampTxt.textContent = "起動中";
    renderCounter();
    stopStream();
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      return showFault("このブラウザではカメラを使えません", "Safari や Chrome の最新版で開いてみてください。");
    }
    navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal: facing }, width:{ideal:2560}, height:{ideal:1440} },
      audio:false
    }).then(function(s){
      stream = s;
      video.srcObject = s;
      var p = video.play();
      if(p && p.catch) p.catch(function(){});
      return waitForFrame();
    }).then(function(){
      stopDemo();
      clearNotice();
      ready = true;
      lampEl.classList.remove("off");
      lampTxt.textContent = "FILM LOADED";
      renderCounter();
    }).catch(function(err){
      var name = err && err.name || "";
      var why;
      if(name === "NotAllowedError" || name === "SecurityError"){
        why = "カメラが許可されていません。";
      }else if(name === "NotFoundError" || name === "OverconstrainedError"){
        why = "カメラが見つかりません。";
      }else if(window.self !== window.top){
        why = "埋め込み表示ではカメラを使えません。";
      }else{
        why = "カメラを起動できませんでした。";
      }
      showNotice(why + " <b>テスト信号</b>に切り替えました。" +
                 "シャッターはそのまま動くので、ここで操作を確かめられます。");
      startDemo();
    });
  }
  function waitForFrame(){
    return new Promise(function(res, rej){
      var tries = 0;
      (function check(){
        if(video.videoWidth && video.videoHeight) return res();
        if(++tries > 60) return rej(new Error("no frame"));
        setTimeout(check, 100);
      })();
    });
  }
  /* ---------- shoot ---------- */
  function shoot(){
    wake();
    if(busy) return;
    if(!ready){ toast("カメラがまだ動いていません"); return; }
    busy = true;
    try{
      var w, h, src;
      if(demo){
        /* render the scene once at full size for the frame itself */
        w = 1920; h = 1440;
        if(scene.width !== w){ scene.width = w; scene.height = h; }
        paintScene(scene, sctx, Date.now());
        src = scene;
      }else{
        w = video.videoWidth; h = video.videoHeight;
        src = video;
      }
      if(!w || !h) throw new Error("no frame");
      var look = currentLook();
      var k = Math.min(1, LONG_EDGE / Math.max(w, h));
      canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
      ctx.drawImage(src, 0, 0, canvas.width, canvas.height);
      develop(canvas, ctx, look);
      var data = canvas.toDataURL("image/jpeg", 0.85);
      Store.add({ roll: state.roll, ts: Date.now(), data: data,
                  facing: demo ? "demo" : facing, look: look.id })
        .then(function(){
          state.count++;
          renderCounter();
          counter.classList.add("tick");
          setTimeout(function(){ counter.classList.remove("tick"); }, 130);
        })
        .catch(function(){ toast("保存できませんでした"); })
        .then(function(){ busy = false; });
      clack();
      if(navigator.vibrate) navigator.vibrate(18);
      if(demo){ scene.width = 768; scene.height = 576; }
    }catch(e){
      busy = false;
      toast("撮れませんでした");
    }
  }

  /* ---------- gallery ---------- */
  function fmt(ts){
    var d = new Date(ts);
    var p = function(n){ return String(n).padStart(2,"0"); };
    return d.getFullYear() + "." + p(d.getMonth()+1) + "." + p(d.getDate()) + "  " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function openGallery(){
    Store.all().then(function(list){
      var shots = list.sort(function(a,b){ return a.id - b.id; });
      var body = $("#galBody");
      body.innerHTML = "";
      $("#galCount").textContent = shots.length + " frames";
      if(!shots.length){
        var e = document.createElement("p");
        e.className = "empty";
        e.innerHTML = "まだ1枚も撮っていません。<br>右上のレリーズボタンを押してみてください。";
        body.appendChild(e);
      }else{
        var rolls = [];
        shots.forEach(function(s){ if(rolls.indexOf(s.roll) < 0) rolls.push(s.roll); });
        rolls.sort(function(a,b){ return b - a; });
        rolls.forEach(function(r){
          var lab = document.createElement("div");
          lab.className = "roll-label";
          var t = document.createElement("span");
          t.textContent = "ROLL " + String(r).padStart(2,"0");
          lab.appendChild(t);
          lab.appendChild(document.createElement("hr"));
          var n = document.createElement("span");
          n.textContent = shots.filter(function(s){ return s.roll === r; }).length + "枚";
          lab.appendChild(n);
          body.appendChild(lab);

          var grid = document.createElement("div");
          grid.className = "grid";
          shots.filter(function(s){ return s.roll === r; }).forEach(function(s){
            var b = document.createElement("button");
            b.type = "button";
            var img = document.createElement("img");
            img.src = s.data;
            img.alt = fmt(s.ts) + " の写真";
            img.loading = "lazy";
            b.appendChild(img);
            b.addEventListener("click", function(){ openViewer(s); });
            grid.appendChild(b);
          });
          body.appendChild(grid);
        });
      }
      $("#gallery").hidden = false;
      document.body.classList.remove("dim");
      clearTimeout(idleT);
    });
  }
  var current = null;
  function openViewer(s){
    current = s;
    $("#vImg").src = s.data;
    $("#vDate").textContent = fmt(s.ts);
    var lens = s.facing === "demo" ? "テスト信号" : "背面";
    var stock = "";
    for(var i = 0; i < LOOKS.length; i++){ if(LOOKS[i].id === s.look) stock = " · " + LOOKS[i].name; }
    $("#vRoll").textContent = "ROLL " + String(s.roll).padStart(2,"0") + " · " + lens + stock;
    $("#viewer").hidden = false;
    $("#viewer .sheet-body").scrollTop = 0;
  }

  /* ---------- wiring ---------- */
  shutter.addEventListener("click", shoot);
  document.addEventListener("keydown", function(e){
    if(!$("#gallery").hidden || !$("#viewer").hidden) return;
    if(e.key === " " || e.key === "Enter"){
      if(document.activeElement && document.activeElement.tagName === "BUTTON") return;
      e.preventDefault(); shoot();
    }
  });
  ["pointerdown","touchstart"].forEach(function(ev){
    document.addEventListener(ev, wake, {passive:true});
  });

  $("#lookBtn").addEventListener("click", function(){
    var i = 0;
    for(var k = 0; k < LOOKS.length; k++){ if(LOOKS[k].id === state.look) i = k; }
    state.look = LOOKS[(i + 1) % LOOKS.length].id;
    renderLook();
    Store.saveMeta();
    toast(currentLook().name + "を入れました");
    wake();
  });

  $("#snd").addEventListener("click", function(){
    soundOn = !soundOn;
    renderSound();
    try{ localStorage.setItem("nf-sound", soundOn ? "1" : "0"); }catch(e){}
    if(soundOn) clack();
    wake();
  });

  $("#retry").addEventListener("click", start);
  $("#galClose").addEventListener("click", function(){ $("#gallery").hidden = true; wake(); });
  $("#vClose").addEventListener("click", function(){ $("#viewer").hidden = true; });
  $("#vDel").addEventListener("click", function(){
    if(!current) return;
    if(!confirm("この1枚を消します。元に戻せません。")) return;
    var id = current.id, roll = current.roll;
    Store.del(id).then(function(){
      $("#viewer").hidden = true;
      if(roll === state.roll && state.count > 0) state.count--;
      renderCounter();
      openGallery();
    });
  });

  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState !== "visible") return;
    if(!demo){
      var t = stream && stream.getVideoTracks()[0];
      if(!t || t.readyState !== "live") start();
    }
    wake();
  });

  /* ---------- orientation ---------- */
  var mq = window.matchMedia("(orientation: portrait)");
  function orient(){ $("#rotate").hidden = !mq.matches; }
  if(mq.addEventListener) mq.addEventListener("change", orient);
  else if(mq.addListener) mq.addListener(orient);
  window.addEventListener("resize", orient);
  orient();

  /* ---------- boot ---------- */
  try{ soundOn = localStorage.getItem("nf-sound") !== "0"; }catch(e){}
  renderSound();

  openDB().then(function(d){
    db = d;
    return Store.loadMeta();
  }).then(function(meta){
    if(meta){ state.roll = meta.roll || 1; state.look = meta.look || "color"; }
    return Store.countRoll(state.roll);
  }).then(function(n){
    state.count = n || 0;
  }).catch(function(){}).then(function(){
    renderCounter();
    renderLook();
    wake();
    start();
  });
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
